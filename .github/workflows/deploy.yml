name: Test and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Flask app
        run: |
          python -m flask --app app routes
          timeout 10s python -m flask --app app run --host 127.0.0.1 --port 5000 &
          sleep 2
          curl --fail --retry 3 http://127.0.0.1:5000/

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy application to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          source: "app.py,templates,requirements.txt"
          target: ${{ secrets.EC2_APP_DIR || '/opt/flask-test' }}
          strip_components: 0

      - name: Install and restart the application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR || '/opt/flask-test' }}"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R "${USER}" "$APP_DIR"
            cd "$APP_DIR"
            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt
            sudo systemctl restart flaskapp
            sudo systemctl is-active --quiet flaskapp
