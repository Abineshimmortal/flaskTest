<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2939; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 3rem 1rem; }
    main { width: min(100%, 620px); margin: 0 auto; padding: 2rem; background: #fff; border: 1px solid #e5eaf1; border-radius: 18px; box-shadow: 0 16px 45px #243b5312; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.04em; }
    .subtitle { margin: .4rem 0 1.7rem; color: #667085; }
    .add-form { display: flex; gap: .65rem; margin-bottom: 1.5rem; }
    input[type="text"] { flex: 1; min-width: 0; padding: .8rem .9rem; border: 1px solid #cfd7e3; border-radius: 10px; font: inherit; }
    button { border: 0; border-radius: 9px; padding: .7rem .95rem; font: inherit; font-weight: 600; cursor: pointer; }
    .add-button { color: white; background: #3563e9; }
    .add-button:hover { background: #244ecb; }
    .count { margin: 0 0 .7rem; color: #667085; font-size: .9rem; }
    ul { display: grid; gap: .65rem; padding: 0; margin: 0; list-style: none; }
    li { display: flex; align-items: center; gap: .7rem; padding: .75rem; border: 1px solid #e7ebf1; border-radius: 11px; }
    .task-title { flex: 1; overflow-wrap: anywhere; }
    .completed .task-title { color: #98a2b3; text-decoration: line-through; }
    .small-button { padding: .45rem .65rem; color: #344054; background: #f1f4f8; font-size: .88rem; }
    .delete-button { color: #b42318; background: #fff1f0; }
    .empty { padding: 1.5rem 1rem; border: 1px dashed #d4dbe5; border-radius: 11px; color: #667085; text-align: center; }
    form { margin: 0; }
    @media (max-width: 480px) { main { padding: 1.35rem; } .add-form { flex-direction: column; } .add-button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>My to-do list</h1>
    <p class="subtitle">Keep track of what you need to get done.</p>

    <form class="add-form" action="{{ url_for('add_todo') }}" method="post">
      <input type="text" name="title" maxlength="200" placeholder="Add a task..." aria-label="Task name" required autofocus>
      <button class="add-button" type="submit">Add task</button>
    </form>

    <p class="count">{{ remaining }} {{ 'task' if remaining == 1 else 'tasks' }} left</p>
    {% if todos %}
      <ul>
        {% for todo in todos %}
          <li class="{{ 'completed' if todo.completed else '' }}">
            <form action="{{ url_for('toggle_todo', todo_id=todo.id) }}" method="post">
              <button class="small-button" type="submit" aria-label="{{ 'Mark incomplete' if todo.completed else 'Mark complete' }}: {{ todo.title }}">{{ 'Undo' if todo.completed else 'Done' }}</button>
            </form>
            <span class="task-title">{{ todo.title }}</span>
            <form action="{{ url_for('delete_todo', todo_id=todo.id) }}" method="post">
              <button class="small-button delete-button" type="submit" aria-label="Delete: {{ todo.title }}">Delete</button>
            </form>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <div class="empty">No tasks yet. Add one above to get started.</div>
    {% endif %}
  </main>
</body>
</html>
